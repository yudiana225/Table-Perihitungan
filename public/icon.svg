<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#ffffff" stroke-opacity="0.2" stroke-width="8"/>

  <!-- Calculator / Table Grid Document Symbol with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Sheet Base -->
    <rect x="96" y="96" width="320" height="320" rx="32" fill="#FFFFFF"/>
    
    <!-- Table Header (Gold/Yellow banner) -->
    <path d="M96 128C96 110.327 110.327 96 128 96H384C401.673 96 416 110.327 416 128V168H96V128Z" fill="url(#goldGrad)"/>
    
    <!-- Red Accent Top Bar inside -->
    <rect x="120" y="124" width="140" height="16" rx="8" fill="#D97706"/>
    <circle cx="376" cy="132" r="10" fill="#D97706"/>

    <!-- Document Table Grid Lines -->
    <!-- Row 1 -->
    <rect x="120" y="196" width="44" height="28" rx="6" fill="#EEF2F6"/>
    <rect x="176" y="196" width="100" height="28" rx="6" fill="#EEF2F6"/>
    <rect x="288" y="196" width="104" height="28" rx="6" fill="#EEF2F6"/>

    <!-- Row 2 -->
    <rect x="120" y="236" width="44" height="28" rx="6" fill="#F8FAFC"/>
    <rect x="176" y="236" width="100" height="28" rx="6" fill="#F8FAFC"/>
    <rect x="288" y="236" width="104" height="28" rx="6" fill="#F8FAFC"/>

    <!-- Row 3 -->
    <rect x="120" y="276" width="44" height="28" rx="6" fill="#EEF2F6"/>
    <rect x="176" y="276" width="100" height="28" rx="6" fill="#EEF2F6"/>
    <rect x="288" y="276" width="104" height="28" rx="6" fill="#EEF2F6"/>

    <!-- Summary Total Bar (Yellow Accent) -->
    <rect x="120" y="324" width="272" height="36" rx="10" fill="#FEF08A"/>
    <rect x="136" y="336" width="80" height="12" rx="6" fill="#CA8A04"/>
    <rect x="276" y="336" width="100" height="12" rx="6" fill="#CA8A04"/>

    <!-- Checkmark Badge Float on bottom right -->
    <circle cx="380" cy="380" r="44" fill="#10B981" stroke="#FFFFFF" stroke-width="8"/>
    <path d="M364 380L376 392L398 368" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
